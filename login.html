<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atar Dashboard — Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-login">
  <div class="ambient-field" aria-hidden="true">
    <div class="ambient-grid"></div>
    <div class="ambient-pulse"></div>
  </div>

  <nav class="nav-top">
    <span class="nav-logo">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      atar
    </span>
  </nav>

  <main class="login-wrap">
    <div class="login-card card">
      <p class="eyebrow">Owner console</p>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to monitor and manage live conversations.</p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" placeholder="you@business.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>

        <div class="error-text" id="error-text"></div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-label">Log in</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorText = document.getElementById("error-text");
      const submitBtn = document.getElementById("submit-btn");
      const submitLabel = submitBtn.querySelector(".btn-label");

      errorText.textContent = "";
      submitBtn.disabled = true;
      submitBtn.classList.add("is-loading");
      submitLabel.textContent = "Logging in…";

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorText.textContent = error.message;
        submitBtn.disabled = false;
        submitBtn.classList.remove("is-loading");
        submitLabel.textContent = "Log in";
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
