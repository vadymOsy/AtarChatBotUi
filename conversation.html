<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atar Dashboard — Conversation</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar topbar--conv">
    <a class="back-link" href="index.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>All conversations</span>
    </a>
    <h1><span id="conv-title">Conversation</span> <span id="conv-channel-badge"></span></h1>
    <button class="btn-ghost" onclick="signOut()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Log out</span>
    </button>
  </header>

  <div class="conv-detail-wrap">
    <div class="controls-row">
      <div class="control-group">
        <label class="control-label" for="mode-select">Mode</label>
        <div class="select-pill">
          <span class="select-dot" aria-hidden="true"></span>
          <select id="mode-select">
            <option value="ai">AI mode</option>
            <option value="human">Human mode</option>
            <option value="paused">Paused</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label" for="status-select">Lead stage</label>
        <div class="select-pill">
          <span class="select-dot" aria-hidden="true"></span>
          <select id="status-select">
            <option value="new_lead">New lead</option>
            <option value="in_conversation">In conversation</option>
            <option value="interested">Interested</option>
            <option value="ready_to_proceed">Ready to proceed</option>
            <option value="order_link_sent">Order link sent</option>
            <option value="waiting_for_customer">Waiting for customer</option>
            <option value="human_takeover">Human takeover</option>
            <option value="completed">Completed</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
    </div>

    <div class="lead-insight" id="lead-insight" style="display:none">
      <span class="lead-insight-badge" id="lead-insight-badge"></span>
      <span class="lead-insight-text" id="lead-insight-text"></span>
    </div>

    <div class="messages-wrap" id="messages-wrap">
      <div class="empty-state">Loading…</div>
    </div>

    <div class="window-closed-banner" id="window-closed-banner" style="display:none">
      The 24-hour reply window is closed. WhatsApp only allows free-form replies within 24 hours of the customer's last message — sending outside that window risks the number getting flagged. Ask the customer to message again first.
    </div>

    <form class="send-row" id="send-form">
      <textarea id="message-input" placeholder="Type a message to send as the owner…" required></textarea>
      <button type="submit" id="send-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span>Send</span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/conversation.js"></script>
</body>
</html>
